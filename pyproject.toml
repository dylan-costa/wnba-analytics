[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wnba-analytics"
version = "0.1.0"
description = "WNBA game data pipeline for Monte Carlo simulation and game prediction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wnba = "wnba.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wnba = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: tests that need the fetched raw data in data/raw"]
